<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Murottal & Radio Mekarindah</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #10b981;
            --secondary: #0f172a;
            --accent: #f59e0b;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --bg-gradient: linear-gradient(135deg, #022c22 0%, #0f172a 100%);
            --glass: rgba(15, 23, 42, 0.9);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-light);
            height: 100dvh; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--glass);
            backdrop-filter: blur(10px);
            position: relative;
        }

        header {
            padding: 30px 20px 15px; 
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo { font-weight: 600; font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }

        .mode-switch {
            display: flex;
            background: rgba(255,255,255,0.08);
            padding: 4px;
            border-radius: 20px;
        }

        .mode-btn {
            background: none; border: none; color: var(--text-muted);
            padding: 8px 16px; font-size: 0.85rem; cursor: pointer;
            border-radius: 16px; transition: 0.3s;
        }

        .mode-btn.active { background: var(--primary); color: white; font-weight: 600; }

        .player-card { padding: 20px; text-align: center; flex-shrink: 0; }

        .cover-art-container { width: 140px; height: 140px; margin: 0 auto 15px; position: relative; }

        .cover-art {
            width: 100%; height: 100%; object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Perbedaan Bentuk Cover */
        .mode-ayah .cover-art { border-radius: 50%; }
        .mode-radio .cover-art { border-radius: 15px; }
        .spinning { animation: spin 15s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .track-info h2 { font-size: 1.2rem; color: var(--accent); margin-bottom: 4px; }
        .track-info p { font-size: 0.9rem; color: var(--text-muted); }

        .controls-wrapper { margin-top: 20px; display: flex; flex-direction: column; align-items: center; }

        .surah-select {
            background: #1e293b; color: white; border: 1px solid #334155;
            padding: 12px; border-radius: 10px; width: 100%; max-width: 350px;
            margin-bottom: 15px; outline: none; cursor: pointer;
        }

        .player-controls { display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 20px; }

        .btn-ctrl { background: none; border: none; color: var(--text-light); font-size: 1.4rem; cursor: pointer; transition: 0.2s; }
        .btn-ctrl:active { transform: scale(0.9); }

        .btn-play {
            background: var(--primary); color: white; font-size: 1.8rem;
            width: 65px; height: 65px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .volume-container { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 20px; }
        input[type=range] { width: 100px; accent-color: var(--primary); cursor: pointer; }

        /* Waduh Teks Quran */
        .quran-container { flex-grow: 1; overflow-y: auto; padding: 10px 20px 100px; background: rgba(0,0,0,0.15); }
        .ayah-item { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; cursor: pointer; }
        .ayah-item.active { background: rgba(16, 185, 129, 0.1); border-left: 4px solid var(--primary); }
        .arabic-text { font-family: 'Amiri', serif; font-size: 1.8rem; text-align: right; line-height: 2.4; color: #fff; }
        .translation-text { color: var(--text-muted); font-size: 0.9rem; margin-top: 10px; line-height: 1.6; }

        /* Tampilan Khusus Radio */
        .radio-visualizer { display: none; text-align: center; padding: 60px 20px; }
        .radio-active .radio-visualizer { display: block; }
        .radio-active .quran-container, .radio-active .surah-select, .radio-active .btn-skip { display: none; }

        .loader-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--secondary); z-index: 100;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }
        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; width: 45px; height: 45px; animation: spin 0.8s linear infinite; }
    </style>
</head>
<body class="mode-ayah">

    <div class="app-container" id="appMain">
        <header>
            <div class="logo"><i class="fas fa-mosque"></i> <span>Mekarindah</span></div>
            <div class="mode-switch">
                <button class="mode-btn active" id="modeAyah" onclick="switchMode('ayah')">Murottal</button>
                <button class="mode-btn" id="modeRadio" onclick="switchMode('radio')">Radio</button>
            </div>
        </header>

        <div class="player-card">
            <div class="cover-art-container">
                <img src="" alt="Cover" class="cover-art" id="coverArt">
            </div>
            
            <div class="track-info">
                <h2 id="currentTrackTitle">Memuat...</h2>
                <p id="currentReciter">Silakan Tunggu</p>
            </div>

            <div class="controls-wrapper">
                <select id="surahSelect" class="surah-select" onchange="handleSurahChange(this.value)">
                    <option value="" disabled selected>Pilih Surat</option>
                </select>

                <div class="player-controls">
                    <button class="btn-ctrl btn-skip" onclick="prevAyah()"><i class="fas fa-step-backward"></i></button>
                    <button class="btn-ctrl btn-play" id="playBtn" onclick="togglePlay()"><i class="fas fa-play"></i></button>
                    <button class="btn-ctrl btn-skip" onclick="nextAyah()"><i class="fas fa-step-forward"></i></button>
                </div>
                
                <div class="volume-container">
                    <i class="fas fa-volume-down"></i>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
                </div>
            </div>
        </div>

        <div id="quranContainer" class="quran-container"></div>

        <div class="radio-visualizer" id="radioStatusArea">
            <i class="fas fa-broadcast-tower fa-3x" style="color: var(--primary); margin-bottom: 20px;"></i>
            <h3 style="color: var(--accent);">Live Streaming</h3>
            <p id="radioStatusText" style="margin-top: 10px;">Menghubungkan ke server...</p>
        </div>

        <div id="loaderOverlay" class="loader-overlay">
            <div class="loader"></div>
            <p style="margin-top:15px; font-size:0.9rem;">Menyiapkan Data...</p>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // DAFTAR COVER KOLEKSI MAS BRO
        const RECITER_COVERS = {
            'mishary': 'https://i.ytimg.com/vi/GLMp_EGGLfk/hq720.jpg?sqp=-oaymwExCK4FEIIDSFryq4qpAyMIARUAAIhCGAHwAQH4AdQGgALgA4oCDAgAEAEYciBWKDgwDw==&rs=AOn4CLAa_DZgLB8D4xcMTFPgxpnQghg_sw',
            'abdul': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT99qAcwhSDEUMmxHHzjEfna9YVgtg-04A8rDvXbaNtZf-70ZkRxFPl_i5J_he-DnfdtO7EhS0ouUaiu-hq_bE8Ni9U3xKBjsAdFgzAg4w&s=10',
            'adi hidayat': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQi7cw0cL0cs4aqyXA5sbBMBaCWGmW0D28pzruJKEWXlx9RYeQLuZouy9VlqLk9oWvOxlO7jHAh6QOXhjPyKPQZqz2rez4YV5XOPrgTTQ&s=10',
            'zainuddin': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDo4WarU6dxMHRx3BFqisexu4euGqv9Ni9_JZA5jZBwA&s=10',
            'latif': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSgeut2z_VzZzl5_B7sbcdxL2FkG3Rd3dOTaS3WCOXEA&s=10',
            'al sudais': 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Abdulrahman_Al-Sudais.jpg/440px-Abdulrahman_Al-Sudais.jpg',
            'ghamdi': 'https://i.ibb.co/Wp0y1hG/ghamdi.jpg',
            'shatri': 'https://i.ibb.co/fQ5N204/shatri.jpg',
            'lili rahmah': 'https://cdn-images.dzcdn.net/images/cover/b2fb0265b6c2182f983df15c6d7e4b87/1900x1900-000000-80-0-0.jpg',
            'default_radio': 'https://mekarindah.netlify.app/img/default.jpg'
        };

        const CONFIG = {
            API_BASE: 'https://api.alquran.cloud/v1',
            RADIO_URL: 'https://stream-020.zeno.fm/d2k0ptw4kkeuv',
            RADIO_META: 'https://api.zeno.fm/mounts/metadata/subscribe/d2k0ptw4kkeuv'
        };

        let state = {
            mode: 'ayah',
            isPlaying: false,
            currentSurah: null,
            currentIndex: 0,
            eventSource: null
        };

        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const coverArt = document.getElementById('coverArt');
        const trackTitle = document.getElementById('currentTrackTitle');
        const reciterText = document.getElementById('currentReciter');
        const statusText = document.getElementById('radioStatusText');

        // AWAL LOAD
        window.onload = async () => {
            coverArt.src = RECITER_COVERS['mishary'];
            try {
                const res = await fetch(`${CONFIG.API_BASE}/surah`);
                const data = await res.json();
                const select = document.getElementById('surahSelect');
                data.data.forEach(s => {
                    select.innerHTML += `<option value="${s.number}">${s.number}. ${s.englishName}</option>`;
                });
                loadSurah(1, false);
            } catch (e) { console.error("Gagal muat list"); }
        };

        // LOAD MUROTTAL
        async function loadSurah(num, autoPlay) {
            if(state.mode === 'radio') return;
            showLoader(true);
            try {
                const res = await fetch(`${CONFIG.API_BASE}/surah/${num}/editions/quran-uthmani,id.indonesian`);
                const json = await res.json();
                state.currentSurah = json.data[0];
                state.currentSurah.translations = json.data[1].ayahs;
                state.currentIndex = 0;
                
                trackTitle.innerText = "Surah " + state.currentSurah.englishName;
                reciterText.innerText = "Mishary Rashid Alafasy";
                coverArt.src = RECITER_COVERS['mishary'];
                
                renderAyahs();
                setAyahAudio(0);
                if(autoPlay) playAudio();
            } finally { showLoader(false); }
        }

        function renderAyahs() {
            const container = document.getElementById('quranContainer');
            container.innerHTML = '';
            state.currentSurah.ayahs.forEach((a, i) => {
                const div = document.createElement('div');
                div.className = 'ayah-item';
                div.id = `a-${i}`;
                div.onclick = () => { setAyahAudio(i); playAudio(); };
                div.innerHTML = `<div class="arabic-text">${a.text}</div><div class="translation-text">${state.currentSurah.translations[i].text}</div>`;
                container.appendChild(div);
            });
        }

        function setAyahAudio(i) {
            state.currentIndex = i;
            audioPlayer.src = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${state.currentSurah.ayahs[i].number}.mp3`;
            document.querySelectorAll('.ayah-item').forEach(el => el.classList.remove('active'));
            const active = document.getElementById(`a-${i}`);
            if(active) {
                active.classList.add('active');
                active.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // SWITCH MODE (DENGAN PERBAIKAN TEKS)
        function switchMode(m) {
            state.mode = m;
            pauseAudio();
            if(state.eventSource) state.eventSource.close();

            document.getElementById('modeAyah').classList.toggle('active', m === 'ayah');
            document.getElementById('modeRadio').classList.toggle('active', m === 'radio');
            document.getElementById('appMain').className = 'app-container ' + (m === 'radio' ? 'radio-active' : '');
            document.body.className = 'mode-' + m;

            if(m === 'radio') {
                // PAKSA GANTI TEKS SEBELUM CONNECT
                statusText.innerText = "Streaming Aktif...";
                trackTitle.innerText = "Mekarindah Radio";
                reciterText.innerText = "Penyiar Sedang Mengudara";
                coverArt.src = RECITER_COVERS['default_radio'];
                
                audioPlayer.src = CONFIG.RADIO_URL;
                setupRadioMetadata();
                playAudio();
            } else {
                loadSurah(state.currentSurah?.number || 1, false);
            }
        }

        // LOGIKA PENCOCOKAN COVER ARTIS
        function findArtistCover(name) {
            const lowerName = name.toLowerCase();
            for (let key in RECITER_COVERS) {
                if (lowerName.includes(key)) return RECITER_COVERS[key];
            }
            return RECITER_COVERS['default_radio'];
        }

        function setupRadioMetadata() {
            state.eventSource = new EventSource(CONFIG.RADIO_META);
            
            state.eventSource.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if(data.streamTitle) {
                    statusText.innerText = "Siaran Radio Mekarindah";
                    const info = data.streamTitle.split(' - ');
                    const artist = info[0] || "Mekarindah Radio";
                    const title = info[1] || "Live Streaming";

                    reciterText.innerText = artist;
                    trackTitle.innerText = title;
                    coverArt.src = findArtistCover(artist);
                }
            };

            state.eventSource.onerror = () => {
                statusText.innerText = "Mode Siaran Hemat Data";
            };
        }

        // FUNGSI DASAR
        function togglePlay() { if(state.isPlaying) pauseAudio(); else playAudio(); }
        function playAudio() { audioPlayer.play().then(() => { state.isPlaying = true; updateUI(); }).catch(e=>console.log("Play blocked")); }
        function pauseAudio() { audioPlayer.pause(); state.isPlaying = false; updateUI(); }
        
        function updateUI() {
            playBtn.innerHTML = state.isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            if(state.isPlaying && state.mode === 'ayah') coverArt.classList.add('spinning');
            else coverArt.classList.remove('spinning');
        }

        function handleSurahChange(v) { loadSurah(v, true); }
        function nextAyah() { if(state.currentIndex < state.currentSurah.ayahs.length - 1) { setAyahAudio(state.currentIndex + 1); playAudio(); } }
        function prevAyah() { if(state.currentIndex > 0) { setAyahAudio(state.currentIndex - 1); playAudio(); } }
        function setVolume(v) { audioPlayer.volume = v; }
        function showLoader(s) { document.getElementById('loaderOverlay').style.display = s ? 'flex' : 'none'; }
        
        audioPlayer.onended = () => { if(state.mode === 'ayah') nextAyah(); };
    </script>
</body>
</html>
