<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Murottal Qur'an & Radio Mekarindah</title>
    
    <!-- External Assets -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #10b981; /* Emerald */
            --secondary: #0f172a; /* Dark Blue */
            --accent: #f59e0b; /* Gold */
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --bg-gradient: linear-gradient(135deg, #022c22 0%, #0f172a 100%);
            --glass: rgba(15, 23, 42, 0.9);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--secondary);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-light);
            height: 100dvh; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--glass);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            position: relative;
        }

        header {
            padding: 30px 20px 15px 20px; 
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: rgba(15, 23, 42, 0.6);
        }

        .logo {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mode-switch {
            display: flex;
            background: rgba(255,255,255,0.08);
            padding: 4px;
            border-radius: 20px;
        }

        .mode-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        .player-card {
            padding: 15px 20px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
            flex-shrink: 0;
        }

        .cover-art-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 10px;
            position: relative;
        }

        .cover-art {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.2);
            transition: transform 0.5s linear;
        }

        .cover-art.spinning {
            animation: spin 10s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .track-info h2 { font-size: 1.1rem; margin-bottom: 4px; color: var(--accent); letter-spacing: 0.5px; }
        .track-info p { font-size: 0.85rem; color: var(--text-muted); }

        .controls-wrapper {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .surah-select {
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
            padding: 10px 15px;
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 15px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 15px;
        }

        .btn-ctrl {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.3rem;
            cursor: pointer;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .btn-ctrl:hover { color: var(--primary); background: rgba(255,255,255,0.05); }
        
        .btn-play {
            background: var(--primary);
            color: white;
            font-size: 1.6rem;
            width: 55px;
            height: 55px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .btn-play:hover { background: #059669; transform: scale(1.05); }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.03);
            padding: 5px 15px;
            border-radius: 20px;
        }
        
        input[type=range] {
            width: 100px;
            accent-color: var(--primary);
            cursor: pointer;
            height: 4px;
        }

        .quran-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px 20px 80px 20px;
            background: rgba(0,0,0,0.2);
            scroll-behavior: smooth;
        }

        .ayah-item {
            padding: 20px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .ayah-item:hover { background: rgba(255,255,255,0.03); }
        .ayah-item.active {
            background: rgba(16, 185, 129, 0.1);
            border-left: 3px solid var(--primary);
        }

        .ayah-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            text-align: right;
            line-height: 2.4;
            margin-bottom: 12px;
            color: #fff;
            padding-left: 20px;
        }

        .translation-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            text-align: left;
        }

        .radio-visualizer {
            display: none;
            text-align: center;
            padding: 60px 20px;
            color: var(--accent);
        }
        .radio-active .radio-visualizer { display: block; }
        .radio-active .quran-container { display: none; }
        .radio-active .surah-select { opacity: 0.5; pointer-events: none; }
        .radio-active .btn-skip { opacity: 0.3; pointer-events: none; }

        .loader-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            display: none;
        }
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 0.8s linear infinite;
        }
        .loader-text { margin-top: 15px; font-size: 0.9rem; color: var(--text-light); }

        .radio-now-playing {
            font-size: 0.75rem;
            color: var(--primary);
            margin-top: 8px;
            padding: 4px 12px;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 20px;
            display: inline-block;
        }

        @media (max-width: 600px) {
            header { padding-top: 35px; }
            .app-container { height: 100dvh; }
            .arabic-text { font-size: 1.4rem; }
            .player-card { padding: 10px 15px; }
            .cover-art-container { width: 90px; height: 90px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo">
                <i class="fas fa-quran"></i> &nbsp;Al-Mekarindah
            </div>
            <div class="mode-switch">
                <button class="mode-btn active" id="modeAyah" onclick="switchMode('ayah')">Murottal</button>
                <button class="mode-btn" id="modeRadio" onclick="switchMode('radio')">Radio</button>
            </div>
        </header>

        <div class="player-card">
            <div class="cover-art-container">
                <img src="https://i.ytimg.com/vi/GLMp_EGGLfk/hq720.jpg?sqp=-oaymwExCK4FEIIDSFryq4qpAyMIARUAAIhCGAHwAQH4AdQGgALgA4oCDAgAEAEYciBWKDgwDw==&rs=AOn4CLAa_DZgLB8D4xcMTFPgxpnQghg_sw" alt="Cover" class="cover-art" id="coverArt">
            </div>
            
            <div class="track-info">
                <h2 id="currentTrackTitle">Surah Al-Fatihah</h2>
                <p id="currentReciter">Mishary Rashid Alafasy</p>
                <div id="radioNowPlaying" class="radio-now-playing" style="display: none;"></div>
            </div>

            <div class="controls-wrapper">
                <select id="surahSelect" class="surah-select" onchange="handleSurahChange(this.value)">
                    <option value="" disabled selected>Memuat Daftar Surat...</option>
                </select>

                <div class="player-controls">
                    <button class="btn-ctrl btn-skip" id="prevBtn" onclick="prevAyah()"><i class="fas fa-step-backward"></i></button>
                    <button class="btn-ctrl btn-play" id="playBtn" onclick="togglePlay()"><i class="fas fa-play"></i></button>
                    <button class="btn-ctrl btn-skip" id="nextBtn" onclick="nextAyah()"><i class="fas fa-step-forward"></i></button>
                </div>
                
                <div class="volume-container">
                    <i class="fas fa-volume-down"></i>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
                </div>
            </div>
        </div>

        <div id="loaderOverlay" class="loader-overlay">
            <div class="loader"></div>
            <div class="loader-text" id="loaderText">Mengambil Data...</div>
        </div>

        <div id="quranContainer" class="quran-container">
            <div style="text-align:center; padding: 20px; color: var(--text-muted);">
                Silakan pilih surat untuk memulai.
            </div>
        </div>

        <div class="radio-visualizer" id="radioMsg">
            <i class="fas fa-broadcast-tower fa-3x" style="margin-bottom: 20px; color: var(--primary);"></i>
            <h3>Mekarindah Radio Live</h3>
            <p>Menyiarkan Murottal & Musik Islami 24 Jam Non-Stop</p>
            <p id="radioStatusText" style="font-size: 0.8rem; margin-top:10px; color: var(--text-muted);">Memuat metadata...</p>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <!-- FastCast4u Stream Info -->
    <div style="display: none;">
        <span class="cc_streaminfo" data-type="song" data-username="kiarafm">Loading ...</span>
    </div>
    <script src="https://eu1.fastcast4u.com/system/streaminfo.js"></script>

    <script>
        // ========== RECITER COVERS (TAMBAHAN BARU) ==========
        const RECITER_COVERS = {
            'mishary': 'https://i.ytimg.com/vi/GLMp_EGGLfk/hq720.jpg?sqp=-oaymwExCK4FEIIDSFryq4qpAyMIARUAAIhCGAHwAQH4AdQGgALgA4oCDAgAEAEYciBWKDgwDw==&rs=AOn4CLAa_DZgLB8D4xcMTFPgxpnQghg_sw',
            'abdul': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT99qAcwhSDEUMmxHHzjEfna9YVgtg-04A8rDvXbaNtZf-70ZkRxFPl_i5J_he-DnfdtO7EhS0ouUaiu-hq_bE8Ni9U3xKBjsAdFgzAg4w&s=10',
            'adi hidayat': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQi7cw0cL0cs4aqyXA5sbBMBaCWGmW0D28pzruJKEWXlx9RYeQLuZouy9VlqLk9oWvOxlO7jHAh6QOXhjPyKPQZqz2rez4YV5XOPrgTTQ&s=10',
            'zainuddin': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDo4WarU6dxMHRx3BFqisexu4euGqv9Ni9_JZA5jZBwA&s=10',
            'latif': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSgeut2z_VzZzl5_B7sbcdxL2FkG3Rd3dOTaS3WCOXEA&s=10',
            'al sudais': 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Abdulrahman_Al-Sudais.jpg/440px-Abdulrahman_Al-Sudais.jpg',
            'lili': 'https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/63/25/dd/6325ddda-63aa-0d43-ac16-46dd36a0afce/artwork.jpg/592x592bb.webp',
            'shatri': 'https://i.ibb.co/fQ5N204/shatri.jpg',
            'abdul basit': 'https://i.ibb.co/RzM805h/abdulbasit.jpg'
        };

        // ========== KONFIGURASI ==========
        const API_BASE = 'https://api.alquran.cloud/v1';
        const RADIO_STREAM_URL = 'https://eu1.fastcast4u.com/proxy/kiarafm/stream';
        const DEFAULT_RADIO_COVER = 'https://mekarindah.netlify.app/img/default.jpg';
        
        // ========== STATE MANAGEMENT ==========
        let state = {
            mode: 'ayah',
            isPlaying: false,
            surahList: [],
            currentSurahData: null, 
            currentIndex: 0,
            radioTitle: "Radio Mekarindah",
            radioArtist: "Live Streaming"
        };

        // ========== DOM ELEMENTS ==========
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const coverArt = document.getElementById('coverArt');
        const surahSelect = document.getElementById('surahSelect');
        const quranContainer = document.getElementById('quranContainer');
        const trackTitle = document.getElementById('currentTrackTitle');
        const reciterName = document.getElementById('currentReciter');
        const loaderOverlay = document.getElementById('loaderOverlay');
        const loaderText = document.getElementById('loaderText');
        const appContainer = document.querySelector('.app-container');
        const radioNowPlayingDiv = document.getElementById('radioNowPlaying');
        const radioStatusText = document.getElementById('radioStatusText');

        // ========== FUNGSI PENCARIAN COVER RECITER ==========
        function getReciterCover(text) {
            if (!text) return null;
            const lower = text.toLowerCase();
            for (const key in RECITER_COVERS) {
                if (lower.includes(key)) {
                    return RECITER_COVERS[key];
                }
            }
            return null;
        }

        // ========== RADIO METADATA (FASTCAST4U) ==========
        function setupRadioMetadataListener() {
            setInterval(function() {
                if (state.mode !== 'radio') return;
                const elem = document.querySelector('.cc_streaminfo');
                if (elem) {
                    const raw = elem.innerText || elem.textContent;
                    if (raw && raw !== "Loading ..." && raw !== "Loading..." && raw !== "") {
                        if (raw !== state.radioTitle) {
                            state.radioTitle = raw;
                            // Parse artist - title
                            let artist = "Radio Mekarindah";
                            let title = raw;
                            if (raw.includes(" - ")) {
                                const parts = raw.split(" - ");
                                artist = parts[0].trim();
                                title = parts.slice(1).join(" - ").trim();
                            }
                            state.radioArtist = artist;
                            state.radioTitle = title;
                            
                            // Update UI Radio
                            updateRadioUI();
                            
                            // Cek cover dari reciter
                            let coverFromReciter = getReciterCover(state.radioArtist) || getReciterCover(state.radioTitle);
                            if (coverFromReciter) {
                                coverArt.src = coverFromReciter;
                            } else {
                                coverArt.src = DEFAULT_RADIO_COVER;
                            }
                            
                            // Update status text
                            if (radioStatusText) {
                                radioStatusText.innerHTML = `<i class="fas fa-music"></i> ${state.radioTitle} - ${state.radioArtist}`;
                            }
                            if (radioNowPlayingDiv) {
                                radioNowPlayingDiv.style.display = 'inline-block';
                                radioNowPlayingDiv.innerHTML = `<i class="fas fa-headphones"></i> ${state.radioTitle.substring(0, 30)}`;
                            }
                        }
                    }
                }
            }, 3000);
        }

        function updateRadioUI() {
            if (state.mode !== 'radio') return;
            trackTitle.innerText = state.radioTitle;
            reciterName.innerText = state.radioArtist;
        }

        // ========== INIT ==========
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`${API_BASE}/surah`);
                const data = await res.json();
                
                if (data.code === 200) {
                    state.surahList = data.data;
                    renderSurahOptions();
                    loadSurah(1, false);
                }
                
                // Setup radio metadata listener
                setupRadioMetadataListener();
                
                // Set volume default
                audioPlayer.volume = 1;
                
            } catch (err) {
                console.error(err);
                alert("Gagal memuat daftar surat. Cek koneksi internet.");
            }
        });

        function renderSurahOptions() {
            surahSelect.innerHTML = '<option value="" disabled>Pilih Surat</option>';
            state.surahList.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.number;
                opt.text = `${s.number}. ${s.englishName} (${s.name})`;
                surahSelect.appendChild(opt);
            });
        }

        function handleSurahChange(val) {
            loadSurah(parseInt(val), true);
        }

        async function loadSurah(surahNumber, autoPlay) {
            if (state.mode === 'radio') return;

            stopAudio();
            state.currentSurahData = null; 
            
            showLoader(true, `Memuat Surat ke-${surahNumber}...`);
            quranContainer.innerHTML = ''; 

            try {
                const url = `${API_BASE}/surah/${surahNumber}/editions/quran-uthmani,id.indonesian`;
                const response = await fetch(url);
                
                if (!response.ok) throw new Error("Gagal mengambil data dari server.");
                const json = await response.json();
                if (json.code !== 200) throw new Error("Format data tidak sesuai.");

                const arData = json.data[0];
                const idData = json.data[1];

                state.currentSurahData = {
                    number: arData.number,
                    englishName: arData.englishName,
                    ayahs: arData.ayahs.map((ayah, idx) => ({
                        numberInSurah: ayah.numberInSurah,
                        text: ayah.text,
                        translation: idData.ayahs[idx].text,
                        globalId: ayah.number 
                    }))
                };

                state.currentIndex = 0;

                updateTrackInfo();
                renderAyahList();
                surahSelect.value = surahNumber;
                setAyahAudio(0);

                if (autoPlay) {
                    setTimeout(() => { playAudio(); }, 500);
                }

            } catch (error) {
                console.error(error);
                quranContainer.innerHTML = `<div style="padding:20px; text-align:center; color:#ef4444;">Error: ${error.message}</div>`;
            } finally {
                showLoader(false);
            }
        }

        function renderAyahList() {
            if (!state.currentSurahData) return;
            
            quranContainer.innerHTML = '';
            state.currentSurahData.ayahs.forEach((ayah, idx) => {
                const el = document.createElement('div');
                el.className = 'ayah-item';
                el.id = `ayah-card-${idx}`;
                el.onclick = () => {
                    if(state.mode === 'ayah') {
                        setAyahAudio(idx);
                        playAudio();
                    }
                };

                el.innerHTML = `
                    <div class="ayah-header">
                        <span>Ayat ${ayah.numberInSurah}</span>
                        <i class="fas fa-play" style="font-size: 0.7rem; opacity: 0.7;"></i>
                    </div>
                    <div class="arabic-text">${ayah.text}</div>
                    <div class="translation-text">${ayah.translation}</div>
                `;
                quranContainer.appendChild(el);
            });
        }

        function setAyahAudio(index) {
            if (!state.currentSurahData) return;
            if (index < 0 || index >= state.currentSurahData.ayahs.length) return;

            state.currentIndex = index;
            const globalId = state.currentSurahData.ayahs[index].globalId;
            const src = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${globalId}.mp3`;
            
            audioPlayer.src = src;
            highlightAyah(index);
        }

        function playAudio() {
            audioPlayer.play().then(() => {
                state.isPlaying = true;
                updatePlayBtn();
            }).catch(e => {
                console.log("Play prevented:", e);
                state.isPlaying = false;
                updatePlayBtn();
            });
        }

        function stopAudio() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            audioPlayer.removeAttribute('src'); 
            audioPlayer.load(); 
            state.isPlaying = false;
            updatePlayBtn();
        }

        function togglePlay() {
            if (state.mode === 'radio') {
                toggleRadio();
                return;
            }

            if (audioPlayer.paused && audioPlayer.src) {
                playAudio();
            } else {
                audioPlayer.pause();
                state.isPlaying = false;
                updatePlayBtn();
            }
        }

        function nextAyah() {
            if (state.mode === 'radio') return;
            const max = state.currentSurahData.ayahs.length - 1;
            
            if (state.currentIndex < max) {
                setAyahAudio(state.currentIndex + 1);
                playAudio();
            } else {
                const nextSurah = state.currentSurahData.number + 1;
                if (nextSurah <= 114) {
                    loadSurah(nextSurah, true);
                }
            }
        }

        function prevAyah() {
            if (state.mode === 'radio') return;
            if (state.currentIndex > 0) {
                setAyahAudio(state.currentIndex - 1);
                playAudio();
            }
        }

        audioPlayer.onended = () => {
            if (state.mode === 'ayah') nextAyah();
        };

        audioPlayer.onerror = (e) => {
            if (state.mode === 'ayah' && state.isPlaying) {
                setTimeout(() => nextAyah(), 1000);
            } else if (state.mode === 'radio' && state.isPlaying) {
                // Reconnect radio if error
                setTimeout(() => {
                    if (state.mode === 'radio' && state.isPlaying) {
                        audioPlayer.src = RADIO_STREAM_URL;
                        audioPlayer.play().catch(() => {});
                    }
                }, 3000);
            }
        };

        function highlightAyah(idx) {
            document.querySelectorAll('.ayah-item.active').forEach(el => el.classList.remove('active'));
            const target = document.getElementById(`ayah-card-${idx}`);
            if (target) {
                target.classList.add('active');
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function updatePlayBtn() {
            if (state.isPlaying) {
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                coverArt.classList.add('spinning');
            } else {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                coverArt.classList.remove('spinning');
            }
        }

        function updateTrackInfo() {
            if (state.mode === 'ayah' && state.currentSurahData) {
                trackTitle.innerText = `QS. ${state.currentSurahData.englishName}`;
                reciterName.innerText = "Mishary Rashid Alafasy";
                // Kembalikan cover ke gambar Mishary
                coverArt.src = "https://i.ytimg.com/vi/GLMp_EGGLfk/hq720.jpg?sqp=-oaymwExCK4FEIIDSFryq4qpAyMIARUAAIhCGAHwAQH4AdQGgALgA4oCDAgAEAEYciBWKDgwDw==&rs=AOn4CLAa_DZgLB8D4xcMTFPgxpnQghg_sw";
                radioNowPlayingDiv.style.display = 'none';
            }
        }

        function showLoader(show, text = 'Loading...') {
            loaderText.innerText = text;
            loaderOverlay.style.display = show ? 'flex' : 'none';
        }

        function setVolume(val) {
            audioPlayer.volume = val;
        }

        // ========== RADIO MODE ==========
        function switchMode(mode) {
            if (state.mode === mode) return;
            
            state.mode = mode;
            stopAudio();

            document.getElementById('modeAyah').className = `mode-btn ${mode === 'ayah' ? 'active' : ''}`;
            document.getElementById('modeRadio').className = `mode-btn ${mode === 'radio' ? 'active' : ''}`;

            if (mode === 'radio') {
                appContainer.classList.add('radio-active');
                audioPlayer.src = RADIO_STREAM_URL;
                state.radioTitle = "Radio Mekarindah";
                state.radioArtist = "Live Streaming";
                updateRadioUI();
                coverArt.src = DEFAULT_RADIO_COVER;
                radioNowPlayingDiv.style.display = 'inline-block';
                if (radioStatusText) radioStatusText.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Menyambung ke stream...';
                
                // Mulai putar radio
                setTimeout(() => {
                    toggleRadio();
                }, 100);
            } else {
                appContainer.classList.remove('radio-active');
                radioNowPlayingDiv.style.display = 'none';
                if(state.currentSurahData) {
                    updateTrackInfo();
                    setAyahAudio(state.currentIndex); 
                } else {
                    loadSurah(1, false);
                }
            }
        }

        function toggleRadio() {
            if (state.mode !== 'radio') return;
            
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => {
                    state.isPlaying = true;
                    updatePlayBtn();
                    if (radioStatusText) radioStatusText.innerHTML = '<i class="fas fa-check-circle"></i> Live Streaming';
                }).catch(() => {
                    state.isPlaying = false;
                    updatePlayBtn();
                    if (radioStatusText) radioStatusText.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Gagal terhubung';
                });
            } else {
                audioPlayer.pause();
                state.isPlaying = false;
                updatePlayBtn();
                if (radioStatusText) radioStatusText.innerHTML = '<i class="fas fa-pause-circle"></i> Dijeda';
            }
        }
    </script>
</body>
</html>
